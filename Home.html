    <!-- JavaScript -->
    <script>
        // Function to handle redirection to Add Jewellery page
function addJewellery() {
    // Show loading message
    alert("Redirecting to Add Jewellery Page...");
    // Wait briefly to show the alert before redirecting
    setTimeout(() => {
        // Redirect to the Add Jewellery page
        window.location.href = "add_jewelry.html";
    }, 500);
}

// Function to handle redirection to Add Bill page
function addBill() {
    // Show loading message
    alert("Redirecting to Add Bill Page...");
    // Wait briefly to show the alert before redirecting
    setTimeout(() => {
        // Redirect to the Add Bill page
        window.location.href = "billing.php";
    }, 500);
}

// Optional: Add event listeners when the document loads
document.addEventListener('DOMContentLoaded', function() {
    // Get references to the buttons
    const jewelleryBtn = document.querySelector('button[onclick="addJewellery()"]');
    const billBtn = document.querySelector('button[onclick="addBill()"]');

    // Add hover effects (optional)
    [jewelleryBtn, billBtn].forEach(btn => {
        if (btn) {
            btn.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.05)';
                this.style.transition = 'transform 0.3s ease';
            });
            
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
            });
        }
    });
});

// Optional: Add check for page load completion
window.onload = function() {
    console.log('Page loaded successfully');
    // You can add any additional initialization code here
};
